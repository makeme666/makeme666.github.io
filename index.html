  <!-- 关键 CSS 内联：首屏渲染零阻塞 -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.6;min-height:100vh}
    .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;height:52px;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,env(safe-area-inset-left))}
    .navbar-brand{font-size:17px;font-weight:600;color:#1d1d1f;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;text-decoration:none}
    .navbar-logo{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(0,113,227,.2);flex-shrink:0}
    .navbar-nav{display:flex;align-items:center;gap:8px;list-style:none}
    .navbar-nav a{font-size:14px;color:#1d1d1f;padding:6px 14px;border-radius:20px;text-decoration:none}
    .hero{background:linear-gradient(160deg,#dceefb 0%,#b8d9f8 40%,#c8e8ff 70%,#e8f4fd 100%);padding:calc(52px + 60px) 24px 80px;text-align:center;position:relative;overflow:hidden}
    .hero-content{position:relative;z-index:1;max-width:680px;margin:0 auto}
    .hero-avatar-wrap{width:120px;height:120px;border-radius:50%;overflow:hidden;border:4px solid rgba(255,255,255,.95);box-shadow:0 8px 32px rgba(0,0,0,.15);margin:0 auto 24px;background:linear-gradient(135deg,#4a9eff,#0071e3);display:flex;align-items:center;justify-content:center}
    .hero-avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-subtitle{font-size:17px;color:#3a6a9a;font-weight:400;line-height:1.5}
    .container{max-width:860px;margin:0 auto;padding:0 20px}
    .section-title{font-size:22px;font-weight:700;color:#1d1d1f;letter-spacing:-.4px;margin-bottom:20px;padding-top:48px}
    .article-list{display:flex;flex-direction:column;gap:16px;padding-bottom:60px}
    .article-card{background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);border:1px solid rgba(255,255,255,.5);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.08);padding:28px 32px;display:block;text-decoration:none;color:inherit}
    .skeleton{background:linear-gradient(90deg,rgba(0,0,0,.04) 25%,rgba(0,0,0,.08) 50%,rgba(0,0,0,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
    </style>

  <!-- 英雄区日期 + 时钟 -->
  <script defer>
  document.addEventListener('DOMContentLoaded', function() {
  // initHeroQuote 已由 main.js DOMContentLoaded 调用，此处不再重复
  (function initHeroClock() {
    var tiangan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    var dizhi   = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    var shuxiang= ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
    function getGanzhi(year) {
      var offset = year - 1984;
      var tg = ((offset % 10) + 10) % 10;
      var dz = ((offset % 12) + 12) % 12;
      return tiangan[tg] + dizhi[dz] + shuxiang[dz] + '年';
    }

    // 获取北京时间（兼容各平台，不依赖 toLocaleString 时区）
    function getBeijingDate() {
      var utc = Date.now() + (new Date().getTimezoneOffset() * 60000);
      return new Date(utc + 8 * 3600000);
    }

    var dateEl = document.getElementById('heroDate');
    var timeEl = document.getElementById('heroTime');
    if (!dateEl || !timeEl) return;

    // 创建时间数字元素（只创建一次）
    timeEl.innerHTML =
      '<span class="time-digits" id="timeH"></span>' +
      '<span class="time-colon">:</span>' +
      '<span class="time-digits" id="timeM"></span>' +
      '<span class="time-colon">:</span>' +
      '<span class="time-digits" id="timeS"></span>';

    var elH = document.getElementById('timeH');
    var elM = document.getElementById('timeM');
    var elS = document.getElementById('timeS');

    var lastDay = -1;
    var lastH = '', lastM = '', lastS = '';

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function updateClock() {
      var now = getBeijingDate();
      var day = now.getDate();
      var h = pad2(now.getHours());
      var m = pad2(now.getMinutes());
      var s = pad2(now.getSeconds());

      if (h !== lastH) { elH.textContent = h; lastH = h; }
      if (m !== lastM) { elM.textContent = m; lastM = m; }
      if (s !== lastS) { elS.textContent = s; lastS = s; }

      if (day !== lastDay) {
        lastDay = day;
        var year = now.getFullYear();
        var month = now.getMonth() + 1;
        dateEl.textContent = year + '年' + month + '月' + day + '日 · ' + getGanzhi(year);
      }
    }

    // 首次渲染
    var now0 = getBeijingDate();
    var yr = now0.getFullYear(), mo = now0.getMonth() + 1, dy = now0.getDate();
    var hh = pad2(now0.getHours()), mm = pad2(now0.getMinutes()), ss = pad2(now0.getSeconds());
    dateEl.textContent = yr + '年' + mo + '月' + dy + '日 · ' + getGanzhi(yr);
    elH.textContent = hh; elM.textContent = mm; elS.textContent = ss;
    lastH = hh; lastM = mm; lastS = ss;
    lastDay = dy;

    setInterval(updateClock, 1000);
  })();

  (function initHomePage() {
    var list = document.getElementById('articleList');
    if (!list) return;

    // 显示骨架屏占位
    list.innerHTML = [
      '<div class="article-card">',
        '<div class="skeleton" style="width:40%;height:14px;margin-bottom:16px;"></div>',
        '<div class="skeleton" style="width:80%;height:22px;margin-bottom:10px;"></div>',
        '<div class="skeleton" style="width:100%;height:14px;margin-bottom:6px;"></div>',
        '<div class="skeleton" style="width:90%;height:14px;margin-bottom:6px;"></div>',
      '</div>',
      '<div class="article-card">',
        '<div class="skeleton" style="width:40%;height:14px;margin-bottom:16px;"></div>',
        '<div class="skeleton" style="width:70%;height:22px;margin-bottom:10px;"></div>',
        '<div class="skeleton" style="width:100%;height:14px;margin-bottom:6px;"></div>',
        '<div class="skeleton" style="width:85%;height:14px;margin-bottom:6px;"></div>',
      '</div>'
    ].join('');

    if (typeof PostLoader === 'undefined') {
      list.innerHTML = '<p style="text-align:center;color:#aeaeb2;padding:60px 0;">脚本未加载，请刷新页面</p>';
      return;
    }

    PostLoader.loadAllPosts().then(function(posts) {
      if (!posts || posts.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:#aeaeb2;padding:60px 0;">暂无文章</p>';
        return;
      }
      var html = posts.map(function(post) {
        return '<a href="' + PostLoader.getPostUrl(post.file) + '" class="article-card" data-tag="' + (post.meta.tag || '') + '">'
          + '<div class="article-card-meta">'
            + '<span class="article-date">'
              + '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M11 2H5a3 3 0 00-3 3v6a3 3 0 003 3h6a3 3 0 003-3V5a3 3 0 00-3-3z" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v3M8 5.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
              + PostLoader.formatDate(post.meta.date || '')
            + '</span>'
            + '<span class="article-tag">' + (post.meta.tag || '未分类') + '</span>'
          + '</div>'
          + '<h3 class="article-title">' + (post.meta.title || '无标题') + '</h3>'
          + '<p class="article-excerpt">' + PostLoader.excerpt(post.content) + '</p>'
          + '<span class="article-read-more">阅读全文 <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
          + '</a>';
      }).join('');
      list.innerHTML = html;
      if (typeof initCardAnimation === 'function') initCardAnimation();
    }).catch(function(e) {
      console.error('文章加载错误:', e);
      list.innerHTML = '<p style="text-align:center;color:#aeaeb2;padding:60px 0;">文章加载失败，请刷新页面重试</p>';
    });
  })();
  });
  </script>
