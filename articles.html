<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>所有文章 · 我的博客</title>
  <meta name="description" content="浏览全部博客文章，涵盖技术、生活、思考与设计。" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.6;min-height:100vh}
    .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;height:52px;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,env(safe-area-inset-left))}
    .navbar-brand{font-size:17px;font-weight:600;color:#1d1d1f;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;text-decoration:none}
    .navbar-logo{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .navbar-nav{display:flex;align-items:center;gap:8px;list-style:none}
    .navbar-nav a{font-size:14px;color:#1d1d1f;padding:6px 14px;border-radius:20px;text-decoration:none}
    .all-articles-header{background:linear-gradient(160deg,#dceefb 0%,#b8d9f8 40%,#e8f4fd 100%);padding:calc(52px + 40px) 24px 50px;text-align:center}
    .all-articles-header h1{font-size:32px;font-weight:700;color:#1a3a5c;letter-spacing:-.5px}
    .skeleton{background:linear-gradient(90deg,rgba(0,0,0,.04) 25%,rgba(0,0,0,.08) 50%,rgba(0,0,0,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
  <link rel="preload" href="css/style.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="css/style.css" /></noscript>
  <link rel="preload" href="js/md-parser.js" as="script" />
  <link rel="preload" href="js/main.js" as="script" />
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <img src="images/avatar.png" alt="" class="navbar-logo" fetchpriority="high" decoding="async" width="26" height="26" />
      我的博客
    </a>
    <ul class="navbar-nav">
      <li><a href="articles.html" class="active">所有文章</a></li>
      <li><a href="about.html">关于作者</a></li>
    </ul>
  </nav>

  <!-- 头部 -->
  <header class="all-articles-header">
    <h1>所有文章</h1>
    <p id="articleCount">加载中...</p>
  </header>

  <main>
    <div class="container" style="padding-bottom:80px;">

      <!-- 搜索框（谷歌风格） -->
      <div class="search-container" style="margin-top:32px;">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 20 20" fill="none">
            <circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13.5 13.5L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索文章标题、标签或内容..." autocomplete="off" />
          <button class="search-clear" id="searchClear" title="清除">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="search-hint" id="searchHint"></div>
      </div>

      <!-- 标签筛选 -->
      <div class="tag-filter">
        <button class="tag-btn active" onclick="filterTag(this,'all')" data-tag="all">全部</button>
        <button class="tag-btn" onclick="filterTag(this,'技术')" data-tag="技术">技术</button>
        <button class="tag-btn" onclick="filterTag(this,'设计')" data-tag="设计">设计</button>
        <button class="tag-btn" onclick="filterTag(this,'思考')" data-tag="思考">思考</button>
        <button class="tag-btn" onclick="filterTag(this,'生活')" data-tag="生活">生活</button>
      </div>

      <!-- 文章列表（动态加载） -->
      <div id="articleList">
        <div style="padding:16px 24px;">
          <div class="skeleton" style="width:60%;height:18px;margin-bottom:10px;"></div>
        </div>
        <div style="padding:16px 24px;">
          <div class="skeleton" style="width:50%;height:18px;margin-bottom:10px;"></div>
        </div>
        <div style="padding:16px 24px;">
          <div class="skeleton" style="width:55%;height:18px;margin-bottom:10px;"></div>
        </div>
      </div>

      <div id="emptyTip" style="display:none;text-align:center;padding:60px 0;color:#aeaeb2;font-size:15px;">
        该分类下暂无文章 🌱
      </div>

    </div>
  </main>

  <!-- 页脚 -->
  <footer>
    <div class="footer-links">
      <a href="index.html">首页</a>
      <a href="articles.html">所有文章</a>
      <a href="about.html">关于作者</a>
    </div>
    <div class="footer-divider"></div>
    <div class="footer-legal">
      <p>&copy; 2026 我的博客 &middot; 保留所有权利</p>
      <p style="margin-top:6px;">
        本站所有文章均为原创内容，转载请注明出处并附原文链接。<br>
        本站内容仅代表个人观点，不构成任何投资建议或法律意见。<br>
        如内容侵犯您的权益，请通过 <a href="mailto:ronghuang555@gmail.com">ronghuang555@gmail.com</a> 联系我们，我们将在 3 个工作日内处理。
      </p>
      <p style="margin-top:8px;font-size:11px;color:#c7c7cc;">
        <a href="diagnostic.html" style="color:#aeaeb2;">🔧 诊断</a> &middot; <a href="#">隐私政策</a> &middot; <a href="#">服务条款</a>
      </p>
    </div>
  </footer>

  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 12V4M4 8l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <script src="js/md-parser.js" defer></script>
  <script src="js/main.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', function() { renderArticleList(); });
  </script>
</body>
</html>
