<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 · 我的博客</title>
  <meta name="description" content="博客文章" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.6;min-height:100vh}
    .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;height:52px;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,env(safe-area-inset-left))}
    .navbar-brand{font-size:17px;font-weight:600;color:#1d1d1f;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;text-decoration:none}
    .navbar-logo{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .navbar-nav{display:flex;align-items:center;gap:8px;list-style:none}
    .navbar-nav a{font-size:14px;color:#1d1d1f;padding:6px 14px;border-radius:20px;text-decoration:none}
    .article-header{background:linear-gradient(160deg,#dceefb 0%,#b8d9f8 40%,#e8f4fd 100%);padding:calc(52px + 48px) 24px 56px;text-align:center}
    .article-header-title{font-size:clamp(24px,4vw,36px);font-weight:700;color:#1a3a5c;letter-spacing:-.5px;max-width:720px;margin:0 auto 16px;line-height:1.3}
    .article-header-meta{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;color:#3a6a9a;font-size:14px}
    .container{max-width:860px;margin:0 auto;padding:0 20px}
  </style>
  <link rel="preload" href="css/style.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="css/style.css" /></noscript>
  <link rel="preload" href="js/md-parser.js" as="script" />
  <link rel="preload" href="js/main.js" as="script" />
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <img src="images/avatar.png" alt="" class="navbar-logo" fetchpriority="high" decoding="async" width="26" height="26" />
      我的博客
    </a>
    <ul class="navbar-nav">
      <li><a href="articles.html">所有文章</a></li>
      <li><a href="about.html">关于作者</a></li>
    </ul>
  </nav>

  <!-- 文章头部（动态填充） -->
  <header class="article-header">
    <div class="container">
      <div class="article-header-meta" id="articleMeta"></div>
      <h1 class="article-header-title" id="articleTitle" style="margin-top:16px;"></h1>
    </div>
  </header>

  <!-- 文章内容（动态填充） -->
  <div class="container" style="padding-bottom:80px;">
    <a href="index.html" class="back-btn" style="display:inline-flex;align-items:center;gap:6px;margin-top:32px;color:#0071e3;font-size:14px;font-weight:500;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回首页
    </a>
    <article class="article-body" id="articleBody"></article>

    <!-- 打赏区域 -->
    <div class="reward-section">
      <div style="font-size:28px;margin-bottom:12px;">☕</div>
      <h3 class="reward-title">如果本文对你有帮助</h3>
      <p class="reward-subtitle">请作者喝杯咖啡，支持持续创作 ✨</p>
      <button class="reward-toggle-btn" onclick="toggleReward(this)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2l1.5 3 3.5.5-2.5 2.5.5 3.5L8 10l-3 1.5.5-3.5L3 5.5l3.5-.5L8 2z" stroke="white" stroke-width="1.2" stroke-linejoin="round" fill="rgba(255,255,255,0.3)"/></svg>
        打赏支持
      </button>
      <div class="reward-qr-area" id="rewardQR">
        <div class="reward-qr-item">
          <img src="images/wechat_qrcode.png" alt="微信收款码" style="width:160px;height:160px;border-radius:8px;" />
          <span class="reward-qr-label"><span class="wechat-icon">●</span> 微信支付</span>
        </div>
        <div class="reward-qr-item">
          <img src="images/alipay_qrcode.jpg" alt="支付宝收款码" style="width:160px;height:160px;border-radius:8px;" />
          <span class="reward-qr-label"><span class="alipay-icon">●</span> 支付宝</span>
        </div>
      </div>
      <p style="font-size:12px;color:#aeaeb2;margin-top:20px;">感谢每一位读者的支持与鼓励 💙</p>
    </div>
  </div>

  <!-- 页脚 -->
  <footer>
    <div class="footer-links">
      <a href="index.html">首页</a>
      <a href="articles.html">所有文章</a>
      <a href="about.html">关于作者</a>
    </div>
    <div class="footer-divider"></div>
    <div class="footer-legal">
      <p>© 2026 我的博客 · 保留所有权利</p>
      <p style="margin-top:6px;">
        本站所有文章均为原创内容，转载请注明出处并附原文链接。<br>
        本站内容仅代表个人观点，不构成任何投资建议或法律意见。<br>
        如内容侵犯您的权益，请通过 <a href="mailto:blog@example.com">blog@example.com</a> 联系我们，我们将在 3 个工作日内处理。
      </p>
      <p style="margin-top:8px;font-size:11px;color:#c7c7cc;"><a href="#">隐私政策</a> · <a href="#">服务条款</a></p>
    </div>
  </footer>

  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 12V4M4 8l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <script src="js/md-parser.js" defer></script>
  <script src="js/main.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', async function renderArticle() {
      const params = new URLSearchParams(window.location.search);
      const postFile = params.get('post');
      const basePath = 'posts/';
      if (!postFile) {
        document.getElementById('articleBody').innerHTML = '<p style="text-align:center;padding:60px 0;color:#aeaeb2;">文章未找到</p>';
        return;
      }
      try {
        // 诊断日志（仅本地开发可见）
        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocal) console.log('[Article] 尝试加载:', basePath + postFile);

        const res = await fetch(basePath + postFile);
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${postFile}`);

        let md;
        try {
          md = await res.text();
        } catch (e) {
          // blob 兜底
          const res2 = await fetch(basePath + postFile);
          const blob = await res2.blob();
          md = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsText(blob);
          });
        }

        const { meta, content } = parseFrontmatter(md);
        document.title = (meta.title || '未命名文章') + ' · 我的博客';
        document.getElementById('articleMeta').innerHTML = `
          <span>📅 ${PostLoader.formatDate(meta.date || new Date().toISOString())}</span>
          <span>·</span>
          <span>🏷 ${meta.tag || '未分类'}</span>
          <span>·</span>
          <span>⏱ 约 ${meta.readtime || '5'}分钟阅读</span>`;
        document.getElementById('articleTitle').textContent = meta.title || '未命名文章';
        document.getElementById('articleBody').innerHTML = parseMarkdown(content);
      } catch(e) {
        console.error('[Article] 加载失败:', e);
        document.getElementById('articleBody').innerHTML = `
          <div style="text-align:center;padding:60px 0;">
            <div style="font-size:48px;margin-bottom:16px;">📭</div>
            <h3 style="color:#333;margin-bottom:12px;">文章加载失败</h3>
            <p style="color:#aeaeb2;font-size:14px;margin-bottom:24px;">
              文件: ${escapeHtml(postFile)}<br/>
              原因: ${escapeHtml(e.message)}<br/>
              请检查文章文件是否存在，或确认网络连接正常。
            </p>
            <a href="articles.html" style="display:inline-block;margin-top:24px;padding:10px 24px;background:#0071e3;color:#fff;border-radius:20px;text-decoration:none;">返回文章列表</a>
          </div>`;
      }
    });
    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
